[package]
name = "thocci-cli"
description = "Mechanical keyboard sounds for Linux, Windows, and macOS (CLI + daemon)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "thocci"
path = "src/main.rs"

[dependencies]
thocci-core = { path = "../thocci-core" }
clap = { version = "4.5", features = ["derive"] }
